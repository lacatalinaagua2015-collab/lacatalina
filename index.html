  <script>
    var firebaseConfig = {
      apiKey: "AIzaSyCqZnFu-I-5MdnSybf7e5t5l7jnyuho4_o",
      authDomain: "la-catalina-416d5.firebaseapp.com",
      projectId: "la-catalina-416d5",
      storageBucket: "la-catalina-416d5.firebasestorage.app",
      messagingSenderId: "1092497470043",
      appId: "1:1092497470043:web:13c3eb5473541a7260c57e"
    };
    try {
      if(!firebase.apps || !firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
      }
      window.db = firebase.firestore();
      // ── AUTENTICACIÓN REAL (single-user, email + contraseña) ──────────────
      // Antes: signInAnonymously() -> cualquiera con la app entraba y leía/escribía
      // TODO el negocio. Ahora se usa una cuenta real (email+password) de Guillermo,
      // con persistencia LOCAL para no volver a pedir credenciales en cada apertura.
      // _authReady resuelve cuando el estado de auth se estabiliza (con o sin sesión).
      try { firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL); }
      catch(e){ console.warn("setPersistence:", e); }
      window._authReady = new Promise(function(resolve){
        var listo=false;
        firebase.auth().onAuthStateChanged(function(u){ if(!listo){ listo=true; resolve(u||null); } });
        setTimeout(function(){ if(!listo){ listo=true; resolve(firebase.auth().currentUser||null); } }, 6000);
      });

      // Cloud Messaging — para las notificaciones push (14-app.js pide el
      // token acá adentro con messagingLC.getToken(...))
      try { if(firebase.messaging.isSupported()) window.messagingLC = firebase.messaging(); }
      catch(e) { console.warn("Cloud Messaging no disponible en este navegador:", e); }

      // Firebase secundario: Emma Control (para enviar datos de integración)
      var ecConfig = {
        apiKey: "AIzaSyBbLoljOPJgjNvVN7bfOuMl8NrUjFB-agU",
        authDomain: "emma-control.firebaseapp.com",
        projectId: "emma-control",
      };
      try {
        var ecApp = firebase.apps.find(a=>a.name==='emma-control') || firebase.initializeApp(ecConfig,'emma-control');
        window.dbEC = firebase.firestore(ecApp);
      } catch(e){ console.log('EC init:',e); }

      // Función para enviar datos del día a Emma Control
      window.enviarAEmmaControl = function(token, fecha, ingresos, gastos){
        if(!token || !window.dbEC) return;
        var ref = window.dbEC.collection('integraciones').doc(token).collection('movs');
        var batch = window.dbEC.batch();
        // Ingreso del día
        if(ingresos.total > 0){
          var ingId = 'lc_ing_' + fecha.replace(/-/g,'');
          batch.set(ref.doc(ingId), {
            id: ingId,
            tipo: 'ingreso',
            ent: 'negocio',
            desc: 'La Catalina — Reparto ' + fecha,
            monto: ingresos.total,
            efectivo: ingresos.efectivo,
            transferencia: ingresos.transferencia,
            cat: 'La Catalina',
            fecha: fecha,
            metodo: 'efectivo',
            _origen: 'la_catalina',
            _ts: Date.now(),
          });
        }
        // Gastos del día
        (gastos||[]).forEach(function(g, i){
          if(!g.monto || g.monto <= 0) return;
          var gId = 'lc_gas_' + fecha.replace(/-/g,'') + '_' + i;
          batch.set(ref.doc(gId), {
            id: gId,
            tipo: 'gasto',
            ent: 'negocio',
            desc: g.desc || 'Gasto reparto',
            monto: g.monto,
            cat: g.cat || 'Otros',
            fecha: fecha,
            metodo: g.metodo || 'efectivo',
            _origen: 'la_catalina',
            _ts: Date.now(),
          });
        });
        batch.commit().then(function(){ console.log('✅ Datos enviados a Emma Control'); })
          .catch(function(e){ console.log('Error Emma Control:', e); });
      };
      window.db.enablePersistence({synchronizeTabs:false}).catch(function(err){
        if(err.code==="failed-precondition"||err.code==="unimplemented"){
          console.warn("Offline persistence not available:", err.code);
        }
      });
    } catch(e) { console.error("Firebase init error:", e); window.db = null; }

    // ══════════════════════════════════════════════════════════════════════
    //  PERSISTENCIA v2 — una colección top-level por entidad, 1 doc por registro
    //  Reemplaza el esquema viejo de doc único chunked (lc2/config, cl_*, vt_*).
    //  La API pública cloudSave(data) / cloudLoad() se mantiene IGUAL para no
    //  tocar la delicada lógica de merge/offline/archivo de 14-app.js.
    //  Escritura DIFERENCIAL: cada sync solo escribe/borra los registros que
    //  cambiaron respecto al último snapshot (window._lcLastSaved).
    // ══════════════════════════════════════════════════════════════════════
    // Entidades tipo LISTA (array) -> colección; docId = id del registro.
    var LC_LISTAS = {
      clientes:      function(it){ return it.id!=null ? String(it.id) : null; },
      ventas:        function(it){ return it.id!=null ? String(it.id) : null; },
      productos:     function(it){ return it.id!=null ? String(it.id) : null; },
      prospectos:    function(it){ return it.id!=null ? String(it.id) : null; },
      recordatorios: function(it){ return it.id!=null ? String(it.id) : null; },
      mantVeh:       function(it){ return it.id!=null ? String(it.id) : null; },
      noVisitas:     function(it){ return it.id!=null ? String(it.id) : (String(it.clienteId)+'_'+String(it.dia)+'_'+String(it.fecha)); },
      histPrecios:   function(it){ return it.id!=null ? String(it.id) : ('hp_'+String(it.fecha||'').replace(/[^0-9A-Za-z_-]/g,'')); }
    };
    // Entidades tipo MAPA (objeto {clave:valor}) -> colección; docId = clave.
    var LC_MAPAS = ['planillas','cargasDia','zonasReparto'];
    // Config singleton (valores que no son listas) -> config/app
    var LC_CONFIG_KEYS = ['stock','horaAvisoCierre','horasAvisoTrans','diasAvisoMant'];

    function _lcUsuario(){ var u = firebase.auth().currentUser; return (u && !u.isAnonymous) ? u : null; }
    window._lcLastSaved = null;

    function _lcGenId(){ try { if(crypto && crypto.randomUUID) return crypto.randomUUID(); } catch(e){} return 'g'+Date.now()+'_'+Math.random().toString(36).slice(2,9); }
    function _lcVal(v){ return (v && typeof v==='object' && !Array.isArray(v)) ? v : { _v: v }; }
    function _lcUnval(d){ return (d && Object.prototype.hasOwnProperty.call(d,'_v') && Object.keys(d).length===1) ? d._v : d; }

    // Divide operaciones en lotes de <=400 y las commitea con writeBatch encadenado.
    function _lcCommitOps(ops){
      var CH=400, chain=Promise.resolve();
      for(var i=0;i<ops.length;i+=CH){
        (function(slice){
          chain = chain.then(function(){
            var b = window.db.batch();
            slice.forEach(function(op){ if(op.tipo==='set') b.set(op.ref, op.data); else b.delete(op.ref); });
            return b.commit();
          });
        })(ops.slice(i,i+CH));
      }
      return chain;
    }

    function _lcArmarOps(data, prev){
      var ops=[];
      // LISTAS (diff por docId)
      Object.keys(LC_LISTAS).forEach(function(ent){
        var idOf=LC_LISTAS[ent];
        if(!Array.isArray(data[ent])) return; // no vino -> no tocar esta colección
        var col=window.db.collection(ent);
        var prevArr=Array.isArray(prev[ent])?prev[ent]:[];
        var prevMap={}; prevArr.forEach(function(it){ var k=idOf(it); if(k) prevMap[k]=it; });
        var vistos={};
        data[ent].forEach(function(it){
          var id=idOf(it); if(!id){ id=_lcGenId(); }
          vistos[id]=true;
          var antes=prevMap[id];
          if(!antes || JSON.stringify(antes)!==JSON.stringify(it)) ops.push({tipo:'set', ref:col.doc(id), data:it});
        });
        Object.keys(prevMap).forEach(function(id){ if(!vistos[id]) ops.push({tipo:'del', ref:col.doc(id)}); });
      });
      // MAPAS (diff por clave)
      LC_MAPAS.forEach(function(ent){
        if(!data[ent] || typeof data[ent]!=='object') return;
        var col=window.db.collection(ent);
        var prevObj=(prev[ent] && typeof prev[ent]==='object')?prev[ent]:{};
        Object.keys(data[ent]).forEach(function(k){
          if(JSON.stringify(prevObj[k])!==JSON.stringify(data[ent][k])) ops.push({tipo:'set', ref:col.doc(k), data:_lcVal(data[ent][k])});
        });
        Object.keys(prevObj).forEach(function(k){ if(!(k in data[ent])) ops.push({tipo:'del', ref:col.doc(k)}); });
      });
      // CONFIG singleton
      var cfg={}, hayCfg=false;
      LC_CONFIG_KEYS.forEach(function(k){ if(data[k]!==undefined){ cfg[k]=data[k]; hayCfg=true; } });
      if(hayCfg){
        var prevCfg=prev._config||{};
        var igual=LC_CONFIG_KEYS.every(function(k){ return JSON.stringify(prevCfg[k])===JSON.stringify(cfg[k]); });
        if(!igual){ cfg._upd=Date.now(); ops.push({tipo:'set', ref:window.db.collection('config').doc('app'), data:cfg}); }
        data._config=cfg;
      }
      // pulso para los listeners en tiempo real (equivale al viejo _upd de config)
    if(ops.length){
        var _tsPulso = Date.now();
        window._lcUltimoPulsoPropio = _tsPulso; // para que 14-app.js sepa que ESTE pulso es nuestro
        ops.push({tipo:'set', ref:window.db.collection('meta').doc('pulse'), data:{_upd:_tsPulso}});
      }
      return ops;
    }

    function cloudSave(data){
      if(!window.db) return Promise.resolve(false);
      if(!_lcUsuario()) return Promise.resolve(false);
      var ops;
      try { ops=_lcArmarOps(data, window._lcLastSaved||{}); }
      catch(e){ console.error('cloudSave prep err', e); return Promise.resolve(false); }
      if(!ops.length){ return Promise.resolve(true); } // nada cambió
      return _lcCommitOps(ops).then(function(){
        window._lcLastSaved = JSON.parse(JSON.stringify(data));
        return true;
      }).catch(function(e){ console.error('cloudSave err', e); return false; });
    }

    function cloudLoad(){
      if(!window.db) return Promise.resolve(null);
      if(!_lcUsuario()) return Promise.resolve(null);
      var getCol=function(n){ return window.db.collection(n).get(); };
      var listas=Object.keys(LC_LISTAS);
      var gets=listas.map(getCol).concat(LC_MAPAS.map(getCol)).concat([ window.db.collection('config').doc('app').get() ]);
      return Promise.all(gets).then(function(res){
        var data={}, hayAlgo=false;
        listas.forEach(function(ent,i){ var arr=[]; res[i].forEach(function(d){ arr.push(d.data()); }); data[ent]=arr; if(arr.length) hayAlgo=true; });
        LC_MAPAS.forEach(function(ent,i){ var obj={}; res[listas.length+i].forEach(function(d){ obj[d.id]=_lcUnval(d.data()); }); data[ent]=obj; if(Object.keys(obj).length) hayAlgo=true; });
        var cfgDoc=res[res.length-1];
        if(cfgDoc.exists){ var c=cfgDoc.data(); LC_CONFIG_KEYS.forEach(function(k){ if(c[k]!==undefined) data[k]=c[k]; }); data._config=c; hayAlgo=true; }
        // defaults (idénticos al cloudLoad viejo)
        if(!data.recordatorios) data.recordatorios=[];
        if(!data.prospectos) data.prospectos=[];
        if(!data.mantVeh) data.mantVeh=[];
        if(!data.zonasReparto) data.zonasReparto={};
        if(!data.histPrecios) data.histPrecios=[];
        if(!data.horaAvisoCierre) data.horaAvisoCierre='18:00';
        if(!data.horasAvisoTrans) data.horasAvisoTrans=['13:00','19:00'];
        if(!data.diasAvisoMant) data.diasAvisoMant=[3,2,1,0];
        if(!hayAlgo) return null; // no hay nada en el esquema nuevo todavía -> no pisar lo local
        window._lcLastSaved = JSON.parse(JSON.stringify(data));
        return data;
      }).catch(function(e){ console.error('cloudLoad err', e); return null; });
    }

    // ── MIGRACIÓN única del esquema viejo (lc2/config chunked) al nuevo ──────
    // Se ejecuta una sola vez: si NO existe meta/migracion y SÍ existe lc2/config.
    // Hace backup completo en lc2_backup_pre_migracion/{timestamp} (no borra el
    // original) y luego copia cada item a su colección nueva vía cloudSave.
    window.migrarDatosLegacy = function(confirmFn, statusFn){
      if(!window.db || !_lcUsuario()) return Promise.resolve({ok:false, motivo:'sin-auth'});
      var meta=window.db.collection('meta').doc('migracion');
      return meta.get().then(function(m){
        if(m.exists && m.data().hecho) return {ok:true, yaHecha:true};
        return window.db.collection('lc2').doc('config').get().then(function(cfg){
          if(!cfg.exists) return meta.set({hecho:true, fecha:Date.now(), vacio:true}).then(function(){ return {ok:true, nada:true}; });
          return Promise.resolve(confirmFn?confirmFn():true).then(function(ok){
            if(!ok) return {ok:false, cancelada:true};
            if(statusFn) statusFn('Leyendo datos antiguos…');
            return _lcLeerLegacy(cfg).then(function(legacy){
              if(statusFn) statusFn('Haciendo copia de seguridad…');
              var ts=Date.now();
              return window.db.collection('lc2_backup_pre_migracion').doc(String(ts)).set({ data: JSON.stringify(legacy), fecha: ts })
                .then(function(){ if(statusFn) statusFn('Copiando a las colecciones nuevas…'); window._lcLastSaved=null; return cloudSave(legacy); })
                .then(function(res){ if(!res) throw new Error('cloudSave devolvió false durante la migración'); return meta.set({hecho:true, fecha:Date.now(), backup:String(ts)}); })
                .then(function(){ return {ok:true, migrada:true, backup:String(ts)}; });
            });
          });
        });
      }).catch(function(e){ console.error('migración err', e); return {ok:false, error:(e&&e.message)||String(e)}; });
    };

    // Lee el doc viejo lc2/config + chunks cl_*/vt_* + prospectos (idéntico al cloudLoad legacy).
    function _lcLeerLegacy(cfgSnap){
      var col=window.db.collection('lc2');
      var data=cfgSnap.data();
      return Promise.all([ col.doc('clientes_meta').get(), col.doc('ventas_meta').get(), col.doc('prospectos').get() ]).then(function(r){
        var cMeta=r[0], vMeta=r[1], prDoc=r[2];
        var nc=cMeta.exists?(cMeta.data().n||0):0;
        var vn=vMeta.exists?(vMeta.data().n||0):0;
        var cF=[]; for(var i=0;i<nc;i++) cF.push(col.doc('cl_'+i).get());
        var vF=[]; for(var j=0;j<vn;j++) vF.push(col.doc('vt_'+j).get());
        return Promise.all(cF.concat(vF)).then(function(docs){
          var cD=docs.slice(0,nc), vD=docs.slice(nc);
          data.clientes = cD.reduce(function(a,d){return a.concat(d.exists?(d.data().d||[]):[]);},[]);
          data.ventas   = vD.reduce(function(a,d){return a.concat(d.exists?(d.data().d||[]):[]);},[]);
          data.prospectos = prDoc.exists ? (prDoc.data().d||[]) : (data.prospectos||[]);
          return data;
        });
      });
    }
  </script>

    // Migrate old stock format in localStorage before React loads
    try {
      var rawStock = localStorage.getItem('cat_stock_v4');
      if(rawStock) {
       var stockOld = JSON.parse(rawStock);
if(stockOld && !stockOld.soderia) {
  var newStock = {
    soderia:{sifon:stockOld.sifon||0,bidon10:stockOld.bidon10||0,bidon20:stockOld.bidon20||0},

          localStorage.setItem('cat_stock_v4', JSON.stringify(newStock));

        bkeys.slice(1).forEach(function(k){ localStorage.removeItem(k); });
      } catch(e2) {}
    } catch(e) {}
